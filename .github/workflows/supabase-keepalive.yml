# Enable FINTRACK_KEEPALIVE_ENABLED only after the production probe route exists.
# The route must perform a real read-only database query and return HTTP 204.
# The workflow checks daily, but the database is queried only every third UTC day.
name: Supabase production keepalive

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    if: vars.FINTRACK_KEEPALIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query the production database through FinTrack
        shell: bash
        env:
          FINTRACK_KEEPALIVE_URL: ${{ vars.FINTRACK_KEEPALIVE_URL }}
          FINTRACK_KEEPALIVE_TOKEN: ${{ secrets.FINTRACK_KEEPALIVE_TOKEN }}
        run: |
          set -euo pipefail

          # A day-of-month */3 cron expression resets at month boundaries.
          # A UTC-day gate preserves a three-day cadence; manual runs bypass it.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            utc_day=$(( $(date -u +%s) / 86400 ))
            if (( utc_day % 3 != 0 )); then
              echo "No keepalive due today; skipping the database request"
              exit 0
            fi
          fi

          if [[ -z "${FINTRACK_KEEPALIVE_URL}" || -z "${FINTRACK_KEEPALIVE_TOKEN}" ]]; then
            echo "::error::Keepalive URL or token is missing"
            exit 1
          fi

          if [[ "${FINTRACK_KEEPALIVE_URL}" != https://*/api/internal/keepalive ]]; then
            echo "::error::Keepalive URL must be an HTTPS production keepalive endpoint"
            exit 1
          fi

          status="$(curl --proto '=https' \
            --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 5 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${FINTRACK_KEEPALIVE_TOKEN}" \
            --header 'Cache-Control: no-store' \
            "${FINTRACK_KEEPALIVE_URL}")"

          if [[ "${status}" != "204" ]]; then
            echo "::error::Keepalive returned HTTP ${status}; expected 204"
            exit 1
          fi
