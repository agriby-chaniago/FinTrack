name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (database, auth, pooler)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta
      # Local-only defaults plus the local Supabase API keys; no real credential is involved.
      - run: pnpm env:local
      - name: Build the database from committed migrations
        run: pnpm db:migrate
      - run: pnpm db:provision
      - name: Prove migrations are idempotent
        run: pnpm db:migrate
      - run: pnpm test:db
      - name: Backup bundle and restore drill against the full-month fixture
        run: |
          set -euo pipefail
          FINTRACK_KEEP_FIXTURE=1 pnpm exec vitest run --project db tests/reports
          set -a; . ./.env.local; set +a
          BACKUP_DATABASE_URL="postgresql://fintrack_backup:${FINTRACK_BACKUP_DB_PASSWORD}@127.0.0.1:54322/postgres" \
            BUNDLE_DIR="$RUNNER_TEMP/bundle" scripts/backup/create-bundle.sh
          BUNDLE_DIR="$RUNNER_TEMP/bundle" scripts/backup/drill.sh
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against next dev and local Supabase
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
